services:
  hermetric:
    build: .
    container_name: hermetric
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      POLL_INTERVAL_SECONDS: "180"
      # Testing-only static token via .env; setup-token tokens are rejected by the
      # usage endpoint. Leave empty to use the /data token file from ./login.sh.
      CLAUDE_OAUTH_TOKEN: ${CLAUDE_OAUTH_TOKEN:-}
    volumes:
      - hermetric-data:/data

volumes:
  hermetric-data:

networks:
  default:
    # Some daemons (e.g. docker 27 on TrueNAS) auto-assign IPv6 and store the
    # gateway as "addr/64", which newer clients refuse to parse on every later
    # compose command. Nothing here needs v6.
    enable_ipv6: false
